# Every push and pull request: the checks of AGENTS.md and the security scans.
# Actions are pinned to commit SHAs (the tag is in the comment); Dependabot keeps them current.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
{{#ts}}
  web:
    name: TypeScript (typecheck, lint, test, build, audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run build
      - run: pnpm audit

{{/ts}}
{{#rust}}
  rust:
    name: Rust (fmt, clippy, test, cargo deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: cargo deny (advisories, licenses, sources, bans)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

{{/rust}}
{{#cloudflare-pages}}
{{^ts}}
  site:
    name: Site ({{#BUILD_COMMAND}}build, {{/BUILD_COMMAND}}published files)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
{{#rust}}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
{{/rust}}
{{#BUILD_COMMAND}}
      - name: Build
        run: |
          {{BUILD_COMMAND}}
{{/BUILD_COMMAND}}
      - name: Only the site's files are published
        run: |
          test -f {{DIST_DIR}}/index.html || { echo "::error::{{DIST_DIR}}/index.html is missing."; exit 1; }
          found=$(find {{DIST_DIR}} -mindepth 1 \( -name '*.map' -o -name '.*' -o -name node_modules \) -print)
          if [ -n "$found" ]; then echo "::error::Source maps or dotfiles in {{DIST_DIR}}:"; echo "$found"; exit 1; fi

{{/ts}}
{{/cloudflare-pages}}
  security:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # gitleaks scans the whole history, not only the last commit.
          fetch-depth: 0
      - name: gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" -w /repo
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          docker.io/zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --config .gitleaks.toml --redact --verbose --exit-code 1 .
{{#cloudflare-pages}}

  deploy:
    name: Deploy
    needs:
{{#ts}}
      - web
{{/ts}}
{{^ts}}
      - site
{{/ts}}
{{#rust}}
      - rust
{{/rust}}
      - security
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/deploy.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
{{/cloudflare-pages}}
