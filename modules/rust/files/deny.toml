# cargo-deny: `cargo deny check` (CI runs it on every push).
[graph]
all-features = false

[advisories]
# Each ignored advisory needs the reason it does not affect this project.
ignore = []

[licenses]
# Licenses compatible with the project's own; extend deliberately.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
